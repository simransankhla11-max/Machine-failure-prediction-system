<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machine Failure Prediction</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    color:white;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 15% 20%, rgba(56,189,248,.20), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(139,92,246,.20), transparent 30%),
        linear-gradient(135deg,#020617,#0f172a,#111827);
}

/* Animated background circles */

body::before,
body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    z-index:-1;
    animation:float 7s ease-in-out infinite alternate;
}

body::before{
    background:#0ea5e9;
    top:-100px;
    left:-100px;
    opacity:.18;
}

body::after{
    background:#8b5cf6;
    bottom:-100px;
    right:-100px;
    opacity:.18;
    animation-delay:2s;
}

@keyframes float{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(40px,30px) scale(1.15);
    }
}

/* NAVBAR */

nav{
    height:75px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;

    background:rgba(255,255,255,.06);
    border-bottom:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(20px);
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.logo{
    font-size:28px;
    font-weight:700;
    letter-spacing:.5px;
}

.logo span{
    color:#38bdf8;
    text-shadow:0 0 15px rgba(56,189,248,.7);
}

.nav-title{
    font-size:14px;
    color:#cbd5e1;
}

/* MAIN */

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:55px 20px;
}

/* CARD */

.card{
    width:100%;
    max-width:900px;

    padding:45px;

    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.13);

    border-radius:30px;

    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.12);

    transition:.4s ease;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:
        0 40px 100px rgba(0,0,0,.55),
        0 0 35px rgba(56,189,248,.08);
}

/* HEADING */

.card h1{
    text-align:center;
    margin-bottom:10px;
    font-size:36px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #38bdf8,
        #a78bfa
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.card p{
    text-align:center;
    color:#94a3b8;
    margin-bottom:35px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

/* INPUT GROUP */

.input-group{
    display:flex;
    flex-direction:column;
    position:relative;
}

label{
    margin-bottom:9px;
    font-size:13px;
    color:#cbd5e1;
    font-weight:500;
}

/* INPUT */

input{
    width:100%;
    padding:16px 18px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;

    font-size:15px;
    color:#0f172a;

    outline:none;

    background:rgba(255,255,255,.95);

    transition:.3s ease;

    box-shadow:
        0 6px 15px rgba(0,0,0,.18);
}

input:hover{
    transform:translateY(-2px);
    box-shadow:
        0 10px 25px rgba(0,0,0,.28);
}

input:focus{
    transform:translateY(-3px);
    border-color:#38bdf8;

    box-shadow:
        0 0 0 3px rgba(56,189,248,.15),
        0 10px 30px rgba(56,189,248,.18);
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:38px;
}

/* PREDICT BUTTON */

.predict{
    position:relative;
    overflow:hidden;

    padding:15px 42px;

    border:none;
    border-radius:14px;

    cursor:pointer;

    font-size:16px;
    font-weight:600;
    color:white;

    background:linear-gradient(
        135deg,
        #0ea5e9,
        #2563eb,
        #7c3aed
    );

    box-shadow:
        0 10px 25px rgba(37,99,235,.35),
        inset 0 1px rgba(255,255,255,.3);

    transition:.3s ease;
}

/* Shine effect */

.predict::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );

    transform:skewX(-25deg);
    transition:.6s;
}

.predict:hover::before{
    left:140%;
}

.predict:hover{
    transform:
        translateY(-5px)
        scale(1.04);

    box-shadow:
        0 18px 40px rgba(37,99,235,.5),
        0 0 25px rgba(56,189,248,.25);
}

.predict:active{
    transform:
        translateY(-1px)
        scale(.98);
}

/* RESET BUTTON */

.reset{
    padding:15px 30px;

    border:1px solid rgba(239,68,68,.35);
    border-radius:14px;

    cursor:pointer;

    font-size:16px;
    font-weight:600;

    color:#fecaca;

    background:rgba(239,68,68,.12);

    box-shadow:0 8px 20px rgba(0,0,0,.2);

    transition:.3s ease;
}

.reset:hover{
    transform:translateY(-4px) rotate(-1deg);

    background:#ef4444;
    color:white;

    box-shadow:
        0 12px 30px rgba(239,68,68,.35);
}

.reset:active{
    transform:scale(.96);
}

/* LOADER */

.loader{
    display:none;

    margin:30px auto 10px;

    width:55px;
    height:55px;

    border:6px solid rgba(255,255,255,.15);
    border-top:6px solid #38bdf8;

    border-right-color:#8b5cf6;

    border-radius:50%;

    animation:spin .8s linear infinite;

    box-shadow:
        0 0 25px rgba(56,189,248,.25);
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* RESULT */

.result{
    margin-top:35px;

    padding:28px;

    border-radius:20px;

    display:none;

    text-align:center;

    font-size:26px;
    font-weight:700;

    animation:resultAppear .5s ease;
}

@keyframes resultAppear{
    from{
        opacity:0;
        transform:translateY(15px) scale(.96);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.success{
    background:rgba(20,83,45,.45);
    color:#86efac;

    border:1px solid rgba(134,239,172,.2);

    box-shadow:
        0 10px 35px rgba(34,197,94,.15);
}

.failure{
    background:rgba(127,29,29,.45);
    color:#fca5a5;

    border:1px solid rgba(252,165,165,.2);

    box-shadow:
        0 10px 35px rgba(239,68,68,.15);
}

/* FOOTER */

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
    font-size:13px;
}

/* RESPONSIVE */

@media(max-width:700px){

    nav{
        padding:0 20px;
    }

    .nav-title{
        display:none;
    }

    .container{
        padding:30px 15px;
    }

    .card{
        padding:28px 20px;
        border-radius:22px;
    }

    .card h1{
        font-size:28px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }

    .predict,
    .reset{
        width:100%;
    }

    .result{
        font-size:21px;
    }
}

</style>
</head>

<body>

<nav>

    <div class="logo">
        Machine<span>AI</span>
    </div>

    <div class="nav-title">
        Machine Failure Prediction System
    </div>

</nav>

<div class="container">

    <div class="card">

        <h1>Predict Machine Failure</h1>

        <p>
            Enter the machine parameters to analyze its condition using AI.
        </p>

        <div class="grid">

            <div class="input-group">
                <label>Air Temperature (K)</label>
                <input type="number" id="air" placeholder="e.g. 298">
            </div>

            <div class="input-group">
                <label>Process Temperature (K)</label>
                <input type="number" id="process" placeholder="e.g. 308">
            </div>

            <div class="input-group">
                <label>Rotational Speed (RPM)</label>
                <input type="number" id="speed" placeholder="e.g. 1500">
            </div>

            <div class="input-group">
                <label>Torque (Nm)</label>
                <input type="number" id="torque" placeholder="e.g. 40">
            </div>

            <div class="input-group">
                <label>Tool Wear (min)</label>
                <input type="number" id="wear" placeholder="e.g. 100">
            </div>

        </div>

        <div class="buttons">

            <button class="predict" onclick="predict()">
                ⚡ Predict Failure
            </button>

            <button class="reset" onclick="resetForm()">
                ↻ Reset
            </button>

        </div>

        <div class="loader" id="loader"></div>

        <div class="result" id="result">
            Prediction
        </div>

    </div>

</div>

<footer>
    © 2026 Machine Failure Prediction System
</footer>


<script>

async function predict(){

    const loader = document.getElementById("loader");
    const result = document.getElementById("result");

    loader.style.display = "block";
    result.style.display = "none";

    const data = {

        air_temperature:
            Number(document.getElementById("air").value),

        process_temperature:
            Number(document.getElementById("process").value),

        rotational_speed:
            Number(document.getElementById("speed").value),

        torque:
            Number(document.getElementById("torque").value),

        tool_wear:
            Number(document.getElementById("wear").value)
    };

    try{

        const response = await fetch(
            "http://127.0.0.1:8000/predict",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(data)
            }
        );

        const output = await response.json();

        loader.style.display = "none";
        result.style.display = "block";

        if(output.prediction == 1){

            result.className = "result failure";

            result.innerHTML =
                "⚠️ Machine Failure Predicted";

        }
        else{

            result.className = "result success";

            result.innerHTML =
                "✅ Machine is Healthy";

        }

    }

    catch(e){

        loader.style.display = "none";
        result.style.display = "block";

        result.className = "result failure";

        result.innerHTML =
            "❌ Unable to connect to backend.";

    }

}


function resetForm(){

    document
        .querySelectorAll("input")
        .forEach(input => input.value = "");

    document
        .getElementById("result")
        .style.display = "none";

}

</script>

</body>
</html>
